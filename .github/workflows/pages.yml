name: Deploy Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      # 改到部署設定本身時也重新發布一次，讓已上線的舊內容跟著被取代
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare public site
        # 只發布 dashboard 頁面。docs/ 底下的 superpowers/（specs、plans、mockups）、
        # adr/ 與各份 .md 屬於內部開發文件，不上 Pages、不被搜尋引擎索引。
        run: |
          mkdir -p _site
          cp docs/*.html _site/
          cp docs/.nojekyll _site/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
