<title>族群總覽頁重新設計 — Mockup</title>
<style>
:root{
  --bg:#0b0f18; --panel:#0f1624; --panel-2:#141c2e; --border:#1e293b; --border-2:#334155;
  --text:#e2e8f0; --text-2:#94a3b8; --text-3:#64748b;
  --up:#f87171; --down:#4ade80; --accent:#60a5fa; --warn:#fbbf24;
  --mono: ui-monospace,"SF Mono","Cascadia Code",Consolas,"Roboto Mono",monospace;
  --sans: -apple-system,"PingFang TC","Microsoft JhengHei","Segoe UI",sans-serif;
}
:root[data-theme="light"]{
  --bg:#f4f6fb; --panel:#ffffff; --panel-2:#eef1f7; --border:#dde3ee; --border-2:#c7d0e0;
  --text:#0f172a; --text-2:#475569; --text-3:#64748b;
  --up:#dc2626; --down:#16a34a; --accent:#2563eb; --warn:#b45309;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f4f6fb; --panel:#ffffff; --panel-2:#eef1f7; --border:#dde3ee; --border-2:#c7d0e0;
    --text:#0f172a; --text-2:#475569; --text-3:#64748b;
    --up:#dc2626; --down:#16a34a; --accent:#2563eb; --warn:#b45309;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5}
.tabular{font-family:var(--mono);font-variant-numeric:tabular-nums}

.topbar{display:flex;align-items:center;gap:16px;padding:14px 20px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:20}
.topbar h1{font-size:.92rem;font-weight:700;color:var(--text-2);letter-spacing:.06em;text-transform:uppercase;margin:0;white-space:nowrap}
.topbar .updated{font-size:.72rem;color:var(--text-3);margin-left:auto;white-space:nowrap}
.search{flex:1;max-width:320px;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:6px 10px}
.search input{flex:1;background:none;border:none;outline:none;color:var(--text);font-size:.82rem;font-family:var(--sans)}
.search svg{color:var(--text-3);flex-shrink:0}
.sortbtn{display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--border);border-radius:7px;padding:6px 12px;color:var(--text-2);font-size:.78rem;font-weight:600;cursor:pointer;transition:border-color .15s,color .15s}
.sortbtn:hover{border-color:var(--border-2);color:var(--text)}
.sortbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sortbtn svg{transition:transform .2s}
.sortbtn.desc svg{transform:rotate(180deg)}

.layout{display:grid;grid-template-columns:380px 1fr;gap:0;align-items:start}
@media (max-width:860px){.layout{grid-template-columns:1fr}}

.ranklist{border-right:1px solid var(--border);max-height:calc(100vh - 53px);overflow-y:auto}
@media (max-width:860px){.ranklist{border-right:none;max-height:none}}

.row{display:flex;align-items:stretch;gap:0;border-bottom:1px solid var(--border);cursor:pointer;transition:background .15s;position:relative}
.row:hover{background:var(--panel)}
.row.active{background:var(--panel-2)}
.row.active::after{content:"";position:absolute;right:0;top:0;bottom:0;width:2px;background:var(--accent)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

.stripe{width:4px;flex-shrink:0}
.stripe.hi{background:var(--up)}
.stripe.hi-warn{background:var(--warn)}
.stripe.lo{background:var(--down)}
.stripe.none{background:transparent}

.row-body{flex:1;min-width:0;padding:10px 14px 10px 12px;display:flex;flex-direction:column;gap:5px}
.row-top{display:flex;align-items:baseline;gap:10px}
.rank{font-family:var(--mono);font-size:.78rem;color:var(--text-3);width:20px;flex-shrink:0}
.name{font-weight:600;color:var(--text);font-size:.86rem;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chg{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;font-size:.86rem;flex-shrink:0}
.chg.up{color:var(--up)} .chg.down{color:var(--down)}

.row-bottom{display:flex;align-items:center;gap:12px;padding-left:30px}
.spark{flex-shrink:0}
.chips{display:flex;gap:5px;flex-wrap:wrap;min-width:0}
.chip{font-size:.65rem;font-weight:600;padding:1px 6px;border-radius:99px;white-space:nowrap;line-height:1.5}
.chip-buy{color:var(--up);background:color-mix(in srgb, var(--up) 15%, transparent);border:1px solid color-mix(in srgb, var(--up) 35%, transparent)}
.chip-sell{color:var(--down);background:color-mix(in srgb, var(--down) 15%, transparent);border:1px solid color-mix(in srgb, var(--down) 35%, transparent)}
.chip-vol{color:var(--warn);background:color-mix(in srgb, var(--warn) 15%, transparent);border:1px solid color-mix(in srgb, var(--warn) 35%, transparent)}
.chip-rank{color:var(--accent);background:color-mix(in srgb, var(--accent) 15%, transparent);border:1px solid color-mix(in srgb, var(--accent) 35%, transparent)}

.detail{padding:20px 24px;min-width:0}
@media (max-width:860px){.detail{display:none}}
.detail-head{display:flex;align-items:baseline;gap:14px;margin-bottom:4px;flex-wrap:wrap}
.detail-head h2{font-size:1.3rem;margin:0;font-weight:700}
.detail-head .chg{font-size:1.1rem}
.detail-sub{color:var(--text-3);font-size:.76rem;margin-bottom:18px}

.rankchg-row{display:flex;gap:22px;margin-bottom:18px;padding:14px 16px;background:var(--panel);border:1px solid var(--border);border-radius:10px}
.rankchg{display:flex;flex-direction:column;gap:2px}
.rankchg .lbl{font-size:.66rem;color:var(--text-3);text-transform:uppercase;letter-spacing:.06em}
.rankchg .val{font-family:var(--mono);font-size:1.15rem;font-weight:700;display:flex;align-items:center;gap:4px}
.rankchg .val.up{color:var(--up)} .rankchg .val.down{color:var(--down)}

.chipsummary{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.flowcard{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 12px;flex:1;min-width:120px}
.flowcard .lbl{font-size:.66rem;color:var(--text-3);margin-bottom:2px}
.flowcard .val{font-family:var(--mono);font-weight:700;font-size:.92rem}

.subgroup{margin-bottom:16px}
.subgroup-title{font-size:.7rem;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;margin:0 0 6px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.stocktable{width:100%;border-collapse:collapse;font-size:.8rem}
.stocktable th{text-align:left;font-weight:600;color:var(--text-3);font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;padding:4px 8px;border-bottom:1px solid var(--border)}
.stocktable td{padding:6px 8px;border-bottom:1px solid var(--border)}
.stocktable tr{cursor:pointer;transition:background .15s}
.stocktable tr:hover td{background:var(--panel)}
.sid{font-family:var(--mono);color:var(--text-2);font-size:.74rem}
.exch{font-size:.6rem;padding:0 4px;border-radius:3px;margin-left:4px;font-weight:700}
.exch.twse{color:var(--accent);border:1px solid color-mix(in srgb, var(--accent) 40%, transparent)}
.exch.tpex{color:var(--warn);border:1px solid color-mix(in srgb, var(--warn) 40%, transparent)}

.mobile-expand{display:none;padding:12px 16px 16px 30px;background:var(--panel-2);border-bottom:1px solid var(--border)}
@media (max-width:860px){.mobile-expand.open{display:block}}
</style>

<div class="topbar">
  <h1>族群總覽</h1>
  <div class="search">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <input type="text" placeholder="搜尋族群 / 股號 / 名稱…" aria-label="搜尋">
  </div>
  <button class="sortbtn desc" id="sortBtn" onclick="toggleSort()">
    <span id="sortLabel">依漲跌% 排序</span>
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12l7 7 7-7"/></svg>
  </button>
  <div class="updated">資料更新：2026-07-07 13:30</div>
</div>

<div class="layout">
  <div class="ranklist" id="rankList" role="list"></div>
  <div class="detail" id="detailPanel"></div>
</div>

<script>
const SECTORS = [
  {name:"被動元件", chg:6.8, rankToday:1, rankYest:4, rankWeek:11, streakF:5, streakT:2, volSpike:true,
   spark:[100,101,103,104,106,109,113,118,124,131,138],
   foreign:12480, trust:3210, subgroups:{
     "被動元件":[
       {sid:"2327",name:"國巨*",exch:"twse",close:301.34,chg:6.49},
       {sid:"2492",name:"華新科",exch:"twse",close:160.0,chg:8.84},
       {sid:"6449",name:"鈺邦",exch:"twse",close:215.86,chg:9.82},
       {sid:"2375",name:"凱美",exch:"twse",close:91.3,chg:2.93},
       {sid:"6175",name:"立敦",exch:"tpex",close:62.4,chg:9.86},
       {sid:"2413",name:"環科",exch:"twse",close:61.2,chg:6.43},
       {sid:"3221",name:"台嘉碩",exch:"tpex",close:51.3,chg:7.1},
       {sid:"3624",name:"光頡",exch:"tpex",close:66.3,chg:5.24},
     ]}},
  {name:"半導體設備", chg:4.2, rankToday:2, rankYest:2, rankWeek:3, streakF:3, streakT:4, volSpike:true,
   spark:[100,102,101,105,108,107,111,115,117,120,125],
   foreign:28900, trust:9640, subgroups:{
     "半導體製程設備":[
       {sid:"7828",name:"創新服務",exch:"tpex",close:436.78,chg:14.06},
       {sid:"6841",name:"聯亞",exch:"twse",close:158.5,chg:3.2},
     ],
     "封裝測試設備":[
       {sid:"2467",name:"志聖",exch:"twse",close:615.0,chg:-6.5},
     ]}},
  {name:"AI伺服器", chg:3.1, rankToday:3, rankYest:1, rankWeek:1, streakF:-2, streakT:0, volSpike:false,
   spark:[100,104,109,112,108,110,107,109,111,112,114],
   foreign:41200, trust:15300, subgroups:{
     "電腦系統業":[
       {sid:"2301",name:"光寶科",exch:"twse",close:118.5,chg:1.9},
       {sid:"2312",name:"金寶",exch:"twse",close:32.4,chg:-0.6},
     ]}},
  {name:"記憶體", chg:2.4, rankToday:4, rankYest:6, rankWeek:8, streakF:0, streakT:-3, volSpike:false,
   spark:[100,99,101,103,102,104,105,104,106,107,108], foreign:-3200, trust:-1100, subgroups:{
     "記憶體":[{sid:"3529",name:"力旺",exch:"twse",close:2770,chg:-6.9}]}},
  {name:"軟體/雲端", chg:1.8, rankToday:5, rankYest:5, rankWeek:5, streakF:1, streakT:2, volSpike:false,
   spark:[100,101,100,102,103,102,104,105,104,106,107], foreign:8100, trust:2400, subgroups:{
     "軟體服務":[{sid:"6741",name:"APP*-KY",exch:"twse",close:61.0,chg:0.2}]}},
  {name:"面板", chg:0.9, rankToday:6, rankYest:9, rankWeek:14, streakF:0, streakT:0, volSpike:false,
   spark:[100,99,98,99,100,101,100,101,102,101,102], foreign:1200, trust:300, subgroups:{
     "面板":[{sid:"6120",name:"達運",exch:"twse",close:14.2,chg:0.3}]}},
  {name:"PCB", chg:-0.4, rankToday:7, rankYest:7, rankWeek:6, streakF:0, streakT:0, volSpike:false,
   spark:[100,101,100,99,100,99,98,99,98,97,98], foreign:-800, trust:200, subgroups:{
     "PCB":[{sid:"5439",name:"高技",exch:"twse",close:351,chg:0.9}]}},
  {name:"連接器", chg:-1.6, rankToday:8, rankYest:8, rankWeek:7, streakF:-4, streakT:-1, volSpike:false,
   spark:[100,99,97,98,96,95,96,94,95,93,94], foreign:-5400, trust:-900, subgroups:{
     "連接器":[{sid:"3003",name:"健和興",exch:"twse",close:65.3,chg:-0.3}]}},
  {name:"網通設備", chg:-2.8, rankToday:9, rankYest:3, rankWeek:2, streakF:-6, streakT:-3, volSpike:true,
   spark:[100,103,106,104,101,98,95,93,90,88,86], foreign:-19200, trust:-6100, subgroups:{
     "網通設備":[{sid:"6792",name:"詠業",exch:"twse",close:61.18,chg:6.72}]}},
  {name:"光通訊", chg:-3.5, rankToday:10, rankYest:10, rankWeek:9, streakF:-1, streakT:0, volSpike:false,
   spark:[100,98,97,95,96,94,93,91,90,89,88], foreign:-2100, trust:-400, subgroups:{
     "光通訊":[{sid:"3363",name:"上詮",exch:"tpex",close:581,chg:9.8}]}},
];

let sortDesc = true;
let activeIdx = 0;

function fmtLots(v){
  const sign = v > 0 ? "+" : "";
  if (Math.abs(v) >= 10000) return `${sign}${(v/10000).toFixed(1)}萬張`;
  return `${sign}${v.toLocaleString()}張`;
}
function fmtChg(v){ const s = v > 0 ? "+" : ""; return `${s}${v.toFixed(1)}%`; }
function chgClass(v){ return v > 0 ? "up" : (v < 0 ? "down" : ""); }

function sparkSvg(vals, w=64, h=22){
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = (max - min) || 1;
  const pts = vals.map((v,i) => `${(i/(vals.length-1)*w).toFixed(1)},${(h - (v-min)/range*h).toFixed(1)}`).join(" ");
  const up = vals[vals.length-1] >= vals[0];
  const color = up ? "var(--up)" : "var(--down)";
  const last = pts.split(" ").pop().split(",");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true">
    <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="2" fill="${color}"/>
  </svg>`;
}

function stripeClass(s){
  if (s.volSpike && Math.abs(s.rankToday - s.rankYest) >= 5) return "hi-warn";
  if (s.chg > 3) return "hi";
  if (s.chg < -3) return "lo";
  return "none";
}

function buildChips(s){
  const chips = [];
  if (s.streakF >= 2) chips.push(`<span class="chip chip-buy">外資連買${s.streakF}日</span>`);
  if (s.streakF <= -2) chips.push(`<span class="chip chip-sell">外資連賣${Math.abs(s.streakF)}日</span>`);
  if (s.streakT >= 2) chips.push(`<span class="chip chip-buy">投信連買${s.streakT}日</span>`);
  if (s.streakT <= -2) chips.push(`<span class="chip chip-sell">投信連賣${Math.abs(s.streakT)}日</span>`);
  if (s.volSpike) chips.push(`<span class="chip chip-vol">量↑2.5x</span>`);
  const jump = s.rankYest - s.rankToday;
  if (Math.abs(jump) >= 3) chips.push(`<span class="chip chip-rank">日${jump>0?"▲":"▼"}${Math.abs(jump)}</span>`);
  return chips.join("");
}

function renderList(){
  const sorted = [...SECTORS].sort((a,b) => sortDesc ? b.chg - a.chg : a.chg - b.chg);
  const html = sorted.map((s, i) => {
    const origIdx = SECTORS.indexOf(s);
    return `
    <div class="row ${origIdx===activeIdx?'active':''}" tabindex="0" role="listitem"
         onclick="selectSector(${origIdx})" onkeydown="if(event.key==='Enter')selectSector(${origIdx})">
      <div class="stripe ${stripeClass(s)}"></div>
      <div class="row-body">
        <div class="row-top">
          <span class="rank tabular">${i+1}</span>
          <span class="name">${s.name}</span>
          <span class="chg ${chgClass(s.chg)}">${fmtChg(s.chg)}</span>
        </div>
        <div class="row-bottom">
          <span class="spark">${sparkSvg(s.spark)}</span>
          <span class="chips">${buildChips(s)}</span>
        </div>
      </div>
    </div>
    <div class="mobile-expand" id="mexp-${origIdx}"></div>
    `;
  }).join("");
  document.getElementById("rankList").innerHTML = html;
}

function stockRows(list){
  return list.map(st => `
    <tr onclick="event.stopPropagation()">
      <td><span class="sid">${st.sid}</span><span class="exch ${st.exch}">${st.exch==='twse'?'上市':'上櫃'}</span></td>
      <td>${st.name}</td>
      <td class="tabular">${st.close.toLocaleString()}</td>
      <td class="tabular ${chgClass(st.chg)}" style="font-weight:700">${fmtChg(st.chg)}</td>
    </tr>`).join("");
}

function detailHtml(s){
  const jump = s.rankYest - s.rankToday;
  const jumpWeek = s.rankWeek - s.rankToday;
  const subHtml = Object.entries(s.subgroups).map(([sub, stocks]) => `
    <div class="subgroup">
      <div class="subgroup-title">${sub}（${stocks.length}）</div>
      <table class="stocktable">
        <thead><tr><th>股票</th><th>名稱</th><th>收盤</th><th>漲跌%</th></tr></thead>
        <tbody>${stockRows(stocks)}</tbody>
      </table>
    </div>`).join("");

  return `
    <div class="detail-head">
      <h2>${s.name}</h2>
      <span class="chg ${chgClass(s.chg)}">${fmtChg(s.chg)}</span>
    </div>
    <div class="detail-sub">成分股 ${Object.values(s.subgroups).flat().length} 檔（本次 mockup 僅列部分代表股）</div>

    <div class="rankchg-row">
      <div class="rankchg">
        <span class="lbl">日排名</span>
        <span class="val ${jump>0?'up':jump<0?'down':''}">#${s.rankYest} → #${s.rankToday} ${jump!==0?(jump>0?'▲':'▼')+Math.abs(jump):'─'}</span>
      </div>
      <div class="rankchg">
        <span class="lbl">週排名</span>
        <span class="val ${jumpWeek>0?'up':jumpWeek<0?'down':''}">#${s.rankWeek} → #${s.rankToday} ${jumpWeek!==0?(jumpWeek>0?'▲':'▼')+Math.abs(jumpWeek):'─'}</span>
      </div>
    </div>

    <div class="chipsummary">
      <div class="flowcard"><div class="lbl">外資今日</div><div class="val ${chgClass(s.foreign)}">${fmtLots(s.foreign)}</div></div>
      <div class="flowcard"><div class="lbl">投信今日</div><div class="val ${chgClass(s.trust)}">${fmtLots(s.trust)}</div></div>
      <div class="flowcard"><div class="lbl">外資連買/賣</div><div class="val">${s.streakF===0?'─':(s.streakF>0?'連買'+s.streakF+'日':'連賣'+Math.abs(s.streakF)+'日')}</div></div>
    </div>

    ${subHtml}
  `;
}

function selectSector(idx){
  activeIdx = idx;
  const s = SECTORS[idx];
  document.getElementById("detailPanel").innerHTML = detailHtml(s);
  // mobile inline expand
  document.querySelectorAll(".mobile-expand").forEach(el => el.classList.remove("open"));
  const mexp = document.getElementById(`mexp-${idx}`);
  if (mexp){ mexp.innerHTML = detailHtml(s); mexp.classList.add("open"); }
  renderList();
}

function toggleSort(){
  sortDesc = !sortDesc;
  document.getElementById("sortBtn").classList.toggle("desc", sortDesc);
  document.getElementById("sortLabel").textContent = sortDesc ? "依漲跌% 排序" : "依漲跌% 排序（升冪）";
  renderList();
}

renderList();
selectSector(0);
</script>
